[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crossec_forecast"
version = "0.1.0"
description = "High-Performance Cross-Sectional & Time-Series Financial Forecasting and Model Benchmarking Framework"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.22.0",
    "pandas>=1.4.0",
    "scipy>=1.8.0",
    "scikit-learn>=1.0.0",
    "tabulate>=0.9.0",
    "omegaconf>=2.3.0",
    "wandb>=0.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
# --- TSFM backends -------------------------------------------------------------------
# These pull mutually-incompatible dependency pins (and Python-version constraints), so
# they CANNOT share one interpreter. Install each in a separate environment (name it
# whatever you like) and run the corresponding model plugin from that interpreter:
#   recommended: a Python 3.11+ env   ->  pip install -e ".[chronos]"
#   recommended: a Python 3.9-3.11 env ->  pip install -e ".[moment]"
# (verify the exact supported range from each package's own metadata.)
# `crossec_forecast` imports fine without either; a plugin whose backend is absent
# registers but refuses to build (see models/_optional.py), and BenchmarkEngine
# skips it with a warning so one shared roster runs its available subset per env.
chronos = [
    "chronos-forecasting",
]
moment = [
    "momentfm",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["crossec_forecast*"]

