# ======================================================================================
# crossec_forecast — canonical experiment config
#
# Single source of truth for a train / validate / test / benchmark / infer run.
# Schema + defaults live in crossec_forecast/configs/experiment_schema.py; unknown keys
# here raise on load (typo protection). Override any key from the CLI as a dot-list:
#
#   python scripts/train.py -c experiments/experiment.yaml model.name=lstm train.lr=0.0005
#
# Note: write floats with a decimal point in overrides (train.lr=0.0005, not 5e-4).
# ======================================================================================

experiment:
  name: baseline_v1          # groups run folders and wandb runs
  seed: 42

run:
  name: null                 # auto: <timestamp>_<model>_<hash>; set to pin a folder
  output_root: ./runs        # artifacts -> ./runs/<experiment.name>/<run.name>/
  tags: [crossec, panel, L512]

# ---- data / split ---------------------------------------------------------------------
data:
  path: ./data/standard_panel.csv
  target_col: logret1_win
  fwd_ret_col: fwd_logret_1
  timestamp_col: timestamp
  symbol_col: symbol
  feature_pattern: '^crossec_.*_mad_Zscore$'
  feature_cols: null         # explicit whitelist (list of names) — overrides feature_pattern
  seq_len: 512                 # lookback window L; fixed as a control variable across model comparisons
  split:
    train_ratio: 0.70
    val_ratio: 0.15
    test_ratio: 0.15
    embargo_steps: 1         # purged timestamps between splits
  batch_size: 1024              # sized for H100 80GB+; lower this on smaller GPUs
  shuffle_train: true
  num_workers: 4
  drop_last: false

# ---- training / optimisation --------------------------------------------------------
train:
  epochs: 30
  lr: 0.001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  early_stopping_patience: 10    # on val mean rank IC
  min_delta: 0.001               # IC gain below this over best doesn't reset patience (noise filter)
  # loss selection is per-model now: put `loss_type` / `focal_gamma` / `focal_alpha`
  # inside model.config (model.compute_loss reads them). Trainer is loss-agnostic.
  device: auto                   # auto | cuda | mps | cpu
  scheduler_type: reduce_on_plateau   # reduce_on_plateau | cosine | none
  scheduler_patience: 3
  scheduler_factor: 0.5

# ---- single model (scripts/train.py, scripts/infer.py) ------------------------------
model:
  name: lstm
  config:
    hidden_dim: 48
    num_layers: 2
    dropout: 0.2
    pooling: last               # last | mean | attention
    loss_type: bce               # bce | focal  (focal also reads focal_gamma / focal_alpha)

# ---- model roster (scripts/benchmark.py) --------------------------------------------
# start with 
#            python scripts/benchmark.py -c experiments/experiment.yaml
benchmark:
  top_quantile: 0.20
  models:
    # - {name: mlp,            config: {hidden_dims: [64, 32], dropout: 0.2, use_norm: true}}
    # - {name: lstm,           config: {hidden_dim: 48, num_layers: 2, dropout: 0.2, pooling: last}}
    # - {name: dlinear,        config: {kernel_size: 3, individual: false}}
    # Pretrained backbones. A row whose backend library is absent in the running
    # interpreter is skipped with a warning (is_model_available), so this one roster is
    # safe to share across environments — each runs the subset it can. zero-shot rows
    # (moment_zeroshot) take the Trainer eval-only path automatically: no training, just
    # scored on val / test Rank IC next to the trained models.
    - {name: moment_zeroshot,  config: {model_id: AutonLab/MOMENT-1-small, anomaly_criterion: mse, sign: 1.0}}
    # - {name: moment_head_only, config: {model_id: AutonLab/MOMENT-1-small, task: classification}}
    # chronos_bolt_head_only needs data.target_col=fwd_logret_1 (regression target), which
    # is a whole-run data override — keep it in its own benchmark config, not this shared
    # roster. See experiments/models/chronos_bolt_head_only.yaml.

# ---- experiment tracking ------------------------------------------------------------
wandb:
  enabled: true
  project: crossec_forecast
  entity: null                  # your team / username; null = default
  mode: online                  # online | offline | disabled
  group: ${experiment.name}
  job_type: train
  name: null                    # null = run folder name
  notes: null
  tags: []
  log_freq: 1                   # log every N epochs
