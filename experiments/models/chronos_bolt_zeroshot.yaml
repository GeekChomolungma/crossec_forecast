# Chronos-Bolt zero-shot — Pattern B (native forecast head) x NO training: the frozen
# backbone's own next-step forecast, read directly as the cross-sectional score. This is
# Chronos-Bolt used exactly as intended (a single univariate context window in, its own
# forecast out) — not the per-channel-forecast-then-trainable-head compromise in
# chronos_bolt_head_only.
#
# Needs the `chronos` backend (recent Python):  pip install -e ".[chronos]"
#   python scripts/train.py -c experiments/experiment.yaml -c experiments/models/chronos_bolt_zeroshot.yaml
#
# `data.extra_input_cols` is pinned to a single RAW price column (`close`, not a
# cross-sectionally z-scored `crossec_*` feature, and NOT `data.feature_cols` — see
# models/chronos/zeroshot.py for why the two are kept separate). The model log-diffs
# it internally into a realized log-return series before forecasting, so its forecast
# comes out in the exact same units/horizon as `fwd_logret_1`. `feature_cols` is left at
# its base-config default (the crossec_* panel) — simply unused by this model, which only
# ever reads its own extra_input slice of the packed `x`.
#
# This is a whole-run `data:` override, so it CANNOT share the base experiment.yaml's
# `benchmark.models` roster (mlp/lstm/dlinear/moment_zeroshot all rely on the default
# feature panel with no extra_input_cols) — adding a bare
# `{name: chronos_bolt_zeroshot, config: {...}}` entry there would raise at build time
# (extra_input_dim would resolve to 0, and the model's __init__ explicitly rejects that)
# rather than silently misbehave. This fragment therefore also pins `benchmark.models` to
# a roster of exactly itself, so `scripts/benchmark.py -c experiment.yaml -c this file`
# produces a correctly-scoped one-row report. Cross-model comparison = concat this
# report's benchmark_summary.csv with the others' (same "run per environment, concat +
# re-sort by test_rank_ic" pattern already used for cross-Python-version TSFM backends —
# see pretrained_research.md section 2).
#
# No `data.target_cols` override needed for the default `loss_target: fwd_logret` below:
# the model is never trained (zero-shot) and compute_loss compares directly against
# fwd_logret_1 (batch["fwd_logret"]). `target_cols` stays the base `[logret1_win]` purely
# because PanelTimeSeriesDataset requires *some* valid target_cols to not drop every
# sample — it is otherwise unused here (same situation as moment_zeroshot.yaml).
data:
  extra_input_cols: [close]

model:
  name: chronos_bolt_zeroshot
  config: &chronos_bolt_zeroshot_config
    model_id: amazon/chronos-bolt-small   # tiny | mini | small | base
    input_is_price: true                  # log-diff the raw price window before forecasting
    context_length: null                  # null = full data.seq_len window (raw, pre-diff steps)
    prediction_length: 1                  # next bar
    reduction: mean                       # collapse D per-channel forecasts (D=1 here -> passthrough)
    sign: 1.0                             # flip to -1.0 if val Rank IC comes out negative
    loss_target: fwd_logret               # fwd_logret | y — see the comment above
    loss_type: huber                      # huber | mse (diagnostic val_loss only, never backpropped)
    huber_delta: 1.0
    series_chunk: 4096

# Singleton roster for `scripts/benchmark.py`. Kept in sync with `model.config` above via
# the YAML anchor (&chronos_bolt_zeroshot_config / *chronos_bolt_zeroshot_config) — edit
# the anchor once, both the train (`model:`) and benchmark (`benchmark.models[0]`) paths
# pick it up.
benchmark:
  models:
    - name: chronos_bolt_zeroshot
      config: *chronos_bolt_zeroshot_config
