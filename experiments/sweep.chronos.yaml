# ======================================================================================
# Per-environment sweep spec — Chronos-Bolt (needs the `chronos` backend).
#
# Run this from an interpreter that has `chronos-forecasting` installed
# (pip install -e ".[chronos]", recent Python):
#   python scripts/sweep.py -s experiments/sweep.chronos.yaml --launcher print
#   python scripts/sweep.py -s experiments/sweep.chronos.yaml --launcher local --max-parallel 2
#   python scripts/sweep.py -s experiments/sweep.chronos.yaml --launcher slurm
#
# Convention: one sweep spec per environment. Each spec lists ONLY models runnable in
# that env, so every `entry: train` job is single-model and just works. To sweep models
# from another env (e.g. `moment` on a Python 3.9-3.11 env), copy this file, swap the
# variants, and run it from that interpreter.  See EXPERIMENTS.md section 5.
# ======================================================================================

base_config: experiments/experiment.yaml
entry: train

common_overrides:
  - experiment.name=sweep_chronos_bolt_v1
  - wandb.group=sweep_chronos_bolt_v1
  # Explicit hooks onto the shared data.seq_len / data.batch_size / run.tags defaults in
  # experiment.yaml (currently identical to base — seq_len is a deliberate cross-model
  # control variable). Diverge Chronos here later without touching the shared base file,
  # e.g. context_length wants a different seq_len than the from-scratch models.
  - data.seq_len=512
  - data.batch_size=1024
  - "run.tags=[crossec, panel, L512, chronos]"

variants:
  - name: cbolt_small
    overrides:
      - model.name=chronos_bolt_head_only
      - data.target_col=fwd_logret_1
      - "model.config={model_id: amazon/chronos-bolt-small, loss_type: huber, head_hidden: 32}"
  - name: cbolt_base
    overrides:
      - model.name=chronos_bolt_head_only
      - data.target_col=fwd_logret_1
      - "model.config={model_id: amazon/chronos-bolt-base, loss_type: huber, head_hidden: 32}"

grid:
  train.lr: [0.001]
  experiment.seed: [42, 123]
# => 2 variants x 2 lr x 2 seed = 8 jobs

slurm:
  extra_sbatch: []               # e.g. ["--account=prjs1859", "--qos=normal"]
  # Sourced inside each rendered .sbatch to activate the interpreter. The backslash
  # escapes the OmegaConf interpolation so the literal `${ROOT_BASE}` reaches the
  # .sbatch and bash expands it at job runtime (dual /projects|/gpfs mount).
  # This env must be Python 3.11+ with `pip install -e ".[chronos]"` (conda: py311).
  env_script: '\${ROOT_BASE}/load_exp_env_311.sh'
